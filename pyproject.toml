[project]
name = "reviewbudget"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydriller>=2.12,<3",
    "scikit-learn>=1.5,<2",
]

[project.scripts]
rb = "reviewbudget.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewbudget"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
